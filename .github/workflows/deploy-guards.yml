name: Deploy guards

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Outbound companion regressions
        run: |
          python3 -m unittest discover -s workers/outbound/cold-email -p 'test_*.py'
          python3 -m unittest discover -s workers/outbound/cold-email/openers -p 'test_*.py'
          python3 -m unittest discover -s workers/outbound/cold-email/list-builds -p 'test_*.py'
          python3 -m unittest discover -s workers/outbound/.agents/skills/instantly-load -p 'test_*.py'
      - run: node --test test/outbound-preparation*.test.mjs test/outbound-workshop.test.mjs
        env:
          SWITCHFLOW_WORKSPACE: ${{ github.workspace }}/workers/outbound
      - run: node --test --test-concurrency=2 test/delivery-engine.test.mjs test/delivery-route-access.test.mjs test/lead-lists.test.mjs test/campaign-workspace.test.mjs test/service-role-boundary.test.mjs test/wave-publication.test.mjs
      - name: Production build
        env:
          # Build-time placeholders so Next can compile without real secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key
          COMPASS_OPEN_OPERATOR: "1"
        run: npm run build
