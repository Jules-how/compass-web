name: Outbound pipeline acceptance
on:
  pull_request:
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Outbound workspace usability regressions
        run: node --test test/outbound-workspace-repair.test.mjs
      - run: node --test --test-concurrency=1 test/outbound-pipeline*.test.mjs test/outbound-executor.test.mjs test/crm-international.test.mjs test/crm-legacy-import.test.mjs test/compass-mcp.test.mjs test/outbound-navigation-cache.test.mjs
  representative-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIPELINE_BENCHMARK_COMPANIES: '100000'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/benchmark-outbound-pipeline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outbound-scale
          path: artifacts/outbound-scale.json
