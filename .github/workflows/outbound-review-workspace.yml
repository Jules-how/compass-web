name: Apply verified outbound review changes
on:
  push:
    branches: [fix/outbound-video-feedback]
    paths:
      - .github/workflows/outbound-review-workspace.yml
      - .github/.outbound-transfer/**
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/outbound-video-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify and materialize tested source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, lzma, pathlib, shutil
          root = pathlib.Path.cwd()
          transfer = root / '.github/.outbound-transfer'
          payload = b''.join((transfer / f'part-{i}.xz').read_bytes() for i in range(4))
          manifest = lzma.decompress(payload)
          assert hashlib.sha256(manifest).hexdigest() == '317a260cb03f90a44d404ce20301c1c88b65e94c49d0c5497c56bbf027587b85', 'Manifest integrity check failed'
          changes = json.loads(manifest)
          assert len(changes) == 24
          paths = set()
          prepared = []
          for item in changes:
              # Workflow edits are performed separately by the authorized connector.
              if item['path'] == '.github/workflows/deploy-guards.yml':
                  continue
              rel = pathlib.PurePosixPath(item['path'])
              assert not rel.is_absolute() and '..' not in rel.parts
              assert item['path'] not in paths
              paths.add(item['path'])
              assert item['path'].startswith(('src/', 'test/', 'docs/design/'))
              path = root / rel
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == item['old_sha256'], f'Base changed: {rel}'
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(item['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement.splitlines(keepends=True)
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == item['new_sha256'], f'Result mismatch: {rel}'
              prepared.append((path, new))
          for path, new in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          shutil.rmtree(transfer)
          print(f'Applied and verified {len(prepared)} source files; removed transfer payload.')
          PY
          git add src test docs/design/OUTBOUND_VIDEO_FEEDBACK_2026-09-17.md .github/.outbound-transfer
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'Julian Howard'
          git config user.email '245628125+Jules-how@users.noreply.github.com'
          git commit -m 'Rebuild outbound markets, research and signal-based writing from video feedback'
          git push origin HEAD:refs/heads/fix/outbound-video-feedback
